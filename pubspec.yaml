name: fused_location
description: "A Flutter plugin for high-accuracy location and orientation data, leveraging advanced native APIs."
version: 0.8.0
homepage:

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.kubinsky.fused_location
        pluginClass: FusedLocationPlugin
      ios:
        pluginClass: FusedLocationPlugin
